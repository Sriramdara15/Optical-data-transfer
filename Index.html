<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: sans-serif; text-align: center; padding: 20px; }
  #video { width: 100%; max-width: 400px; background: #ccc; }
  .control-group { margin: 20px 0; }
</style>
</head>
<body>

<h1>Optical Data Transfer</h1>

<div>
  <h2>Sender</h2>
  <textarea id="textInput" placeholder="Enter text"></textarea><br>
  <button onclick="startTransmission()">Transmit</button>
</div>

<hr>

<div>
  <h2>Receiver</h2>
  <video id="video" autoplay playsinline></video><br>
  <button onclick="start Reception()">Start Receiver</button>
  <p>Status: <span id="status">Idle</span></p>
  <p>Received: <span id="receivedText"></span></p>
</div>

<script>
// --- SENDER LOGIC ---
async function textToBinary(text) {
  return text.split('').map(char => 
    char.charCodeAt(0).toString(2).padStart(8, '0')
  ).join('');
}

async function startTransmission() {
  const text = document.getElementById('textInput').value;
  if (!text) return;
  
  const binary = await textToBinary(text);
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  const track = stream.getVideoTracks()[0];
  
  // Preamble: Flash pattern to signal start (e.g., 10101010)
  const preamble = "10101010";
  const fullSignal = preamble + binary;

  for (const bit of fullSignal) {
    const duration = bit === '1' ? 100 : 100; // Fixed clock rate for simplicity
    try {
      await track.applyConstraints({ advanced: [{ torch: bit === '1' }] });
    } catch (e) {
      console.log("Torch not supported or failed");
    }
    await new Promise(r => setTimeout(r, duration));
  }
  
  // Turn off torch at the end
  await track.applyConstraints({ advanced: [{ torch: false }] });
  track.stop();
}

// --- RECEIVER LOGIC ---
let videoElement = document.getElementById('video');
let statusDisplay = document.getElementById('status');
let textDisplay = document.getElementById('receivedText');
let mediaStream = null;

async function startReception() {
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    videoElement.srcObject = mediaStream;
    statusDisplay.innerText = "Listening for preamble...";
    analyzeframes();
  } catch (err) {
    statusDisplay.innerText = "Camera Error: " + err;
  }
}

function analyzeframes() {
  const canvas = document.createElement('canvas');
  const context = canvas.getContext('2d');
  
  // Simplified frame analysis loop
  const interval = setInterval(() => {
    if (videoElement.paused || videoElement.ended) return;
    
    canvas.width = videoElement.videoWidth;
    canvas.height = videoElement.videoHeight;
    context.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
    
    // Sample center pixel brightness
    const frameData = context.getImageData(canvas.width/2 - 10, canvas.height/2 - 10, 20, 20);
    let totalBrightness = 0;
    for (let i = 0; i < frameData.data.length; i += 4) {
      // Calculate luminance
      totalBrightness += (frameData.data[i] * 0.299) + (frameData.data[i+1] * 0.587) + (frameData.data[i+2] * 0.114);
    }
    const averageBrightness = totalBrightness / (frameData.data.length / 4);
    
    // In a full implementation, you would track transitions here against a threshold
    // to detect the preamble and decode the bits.
    // console.log("Brightness:", averageBrightness);

  }, 100); // Sample rate linked to sender clock
}
</script>

</body>
</html>
