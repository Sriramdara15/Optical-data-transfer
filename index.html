<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Optical Data Transfer</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      background: #1a1a1a;
      color: #f0f0f0;
    }
    video {
      width: 100%;
      max-width: 360px;
      background: #000;
      border: 2px solid #444;
      border-radius: 8px;
    }
    .control-group {
      margin: 20px auto;
      max-width: 400px;
      background: #262626;
      padding: 15px;
      border-radius: 10px;
    }
    textarea {
      width: 90%;
      height: 60px;
      font-size: 16px;
      padding: 8px;
      border-radius: 5px;
      border: none;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-top: 10px;
      cursor: pointer;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
    }
    button:disabled {
      background: #555;
    }
    .output-box {
      background: #111;
      padding: 10px;
      border-radius: 5px;
      margin-top: 10px;
      font-family: monospace;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h1>Optical Data Transfer</h1>

  <div class="control-group">
    <h2>Sender</h2>
    <textarea id="textInput" placeholder="Enter short message (e.g., Hi)"></textarea><br>
    <button id="sendBtn" onclick="startTransmission()">Transmit</button>
    <p><small id="senderStatus">Ready</small></p>
  </div>

  <div class="control-group">
    <h2>Receiver</h2>
    <video id="video" autoplay playsinline muted></video><br>
    <button onclick="startReception()">Start Receiver</button>
    <p>Status: <strong id="status">Idle</strong></p>
    <div class="output-box">
      <div>Binary: <span id="binaryDisplay">-</span></div>
      <div style="margin-top: 8px; font-size: 18px; color: #4caf50;">
        Decoded: <span id="receivedText">-</span>
      </div>
    </div>
  </div>

  <script>
    const BIT_DURATION = 250; // ms per bit (slower = more reliable on mobile cameras)
    const PREAMBLE = "10101010";
    const EOT_CHAR = "00000100"; // End of Transmission ASCII (4)

    // --- SENDER LOGIC ---
    function textToBinary(text) {
      return text.split('').map(char =>
        char.charCodeAt(0).toString(2).padStart(8, '0')
      ).join('');
    }

    async function startTransmission() {
      const text = document.getElementById('textInput').value;
      const sendBtn = document.getElementById('sendBtn');
      const senderStatus = document.getElementById('senderStatus');
      if (!text) return;

      sendBtn.disabled = true;
      senderStatus.innerText = "Accessing torch...";

      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }
        });
      } catch (err) {
        alert("Sender Camera/Torch Error: " + err.message);
        sendBtn.disabled = false;
        return;
      }

      const track = stream.getVideoTracks()[0];
      const binaryPayload = textToBinary(text) + EOT_CHAR;
      const fullSignal = PREAMBLE + binaryPayload;

      senderStatus.innerText = "Transmitting (" + fullSignal.length + " bits)...";

      for (let i = 0; i < fullSignal.length; i++) {
        const bit = fullSignal[i];
        try {
          await track.applyConstraints({
            advanced: [{ torch: bit === '1' }]
          });
        } catch (err) {
          console.log("Torch error:", err);
        }
        await new Promise(r => setTimeout(r, BIT_DURATION));
      }

      // Ensure torch turns off
      try {
        await track.applyConstraints({ advanced: [{ torch: false }] });
      } catch (e) {}
      track.stop();

      senderStatus.innerText = "Transmission complete!";
      sendBtn.disabled = false;
    }

    // --- RECEIVER LOGIC ---
    let mediaStream = null;
    let samplerInterval = null;

    async function startReception() {
      const video = document.getElementById('video');
      const statusDisplay = document.getElementById('status');
      const binaryDisplay = document.getElementById('binaryDisplay');
      const textDisplay = document.getElementById('receivedText');

      if (mediaStream) {
        mediaStream.getTracks().forEach(t => t.stop());
      }
      if (samplerInterval) {
        clearInterval(samplerInterval);
      }

      statusDisplay.innerText = "Starting camera...";
      binaryDisplay.innerText = "-";
      textDisplay.innerText = "-";

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }
        });
      } catch (err) {
        try {
          mediaStream = await navigator.mediaDevices.getUserMedia({ video: true });
        } catch (fallbackErr) {
          statusDisplay.innerText = "Camera Error: " + fallbackErr.message;
          return;
        }
      }

      video.srcObject = mediaStream;
      await video.play();

      // Canvas setup for fast brightness sampling
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      canvas.width = 20;
      canvas.height = 20;

      // Calibration phase: measure ambient brightness for 1 second
      statusDisplay.innerText = "Calibrating ambient light...";
      let ambientSamples = [];

      const getBrightness = () => {
        if (video.readyState !== video.HAVE_ENOUGH_DATA) return 0;
        const sx = Math.max(0, (video.videoWidth / 2) - 10);
        const sy = Math.max(0, (video.videoHeight / 2) - 10);
        ctx.drawImage(video, sx, sy, 20, 20, 0, 0, 20, 20);
        const data = ctx.getImageData(0, 0, 20, 20).data;
        let total = 0;
        for (let i = 0; i < data.length; i += 4) {
          total += (data[i] + data[i + 1] + data[i + 2]) / 3;
        }
        return total / (data.length / 4);
      };

      // Collect ambient baseline
      await new Promise(resolve => {
        const calTimer = setInterval(() => {
          ambientSamples.push(getBrightness());
          if (ambientSamples.length >= 10) {
            clearInterval(calTimer);
            resolve();
          }
        }, 100);
      });

      const ambientAvg = ambientSamples.reduce((a, b) => a + b, 0) / ambientSamples.length;
      // Threshold is halfway between ambient light and max brightness (255), with a minimum jump of +35
      const threshold = Math.min(245, Math.max(ambientAvg + 35, (ambientAvg + 255) / 2));

      statusDisplay.innerText = `Listening (Base: ${Math.round(ambientAvg)}, Thresh: ${Math.round(threshold)})`;

      // State machine for preamble sync & bit reading
      let state = "WAITING_FOR_FIRST_ONE";
      let bitBuffer = "";
      let decodedChars = "";

      // Sample every BIT_DURATION ms once locked onto the first flash
      const pollRate = 25; // Check every 25ms for the rising edge of the first '1'
      let lastSampleTime = 0;

      samplerInterval = setInterval(() => {
        const currentBrightness = getBrightness();
        const bit = currentBrightness > threshold ? "1" : "0";
        const now = Date.now();

        if (state === "WAITING_FOR_FIRST_ONE") {
          if (bit === "1") {
            // Rising edge detected! Wait half a bit duration so future samples hit the center of each bit
            state = "LOCKING";
            lastSampleTime = now + (BIT_DURATION / 2);
            statusDisplay.innerText = "Signal detected, syncing...";
          }
        } else if (state === "LOCKING") {
          if (now >= lastSampleTime) {
            state = "READING_PREAMBLE";
            bitBuffer = bit; // First bit of preamble ('1')
            lastSampleTime = now;
            binaryDisplay.innerText = bitBuffer;
          }
        } else if (state === "READING_PREAMBLE" || state === "READING_DATA") {
          if (now - lastSampleTime >= BIT_DURATION) {
            lastSampleTime += BIT_DURATION;
            bitBuffer += bit;
            binaryDisplay.innerText = bitBuffer;

            if (state === "READING_PREAMBLE") {
              if (bitBuffer.length === 8) {
                if (bitBuffer === PREAMBLE) {
                  state = "READING_DATA";
                  bitBuffer = "";
                  statusDisplay.innerText = "Preamble matched! Receiving text...";
                } else {
                  // False trigger; reset
                  state = "WAITING_FOR_FIRST_ONE";
                  bitBuffer = "";
                  statusDisplay.innerText = `Sync failed, listening (Thresh: ${Math.round(threshold)})`;
                }
              }
            } else if (state === "READING_DATA") {
              // Every 8 bits = 1 ASCII character
              if (bitBuffer.length === 8) {
                if (bitBuffer === EOT_CHAR) {
                  // End of transmission reached
                  clearInterval(samplerInterval);
                  statusDisplay.innerText = "Transfer Complete!";
                  return;
                }
                const charCode = parseInt(bitBuffer, 2);
                const char = String.fromCharCode(charCode);
                decodedChars += char;
                textDisplay.innerText = decodedChars;
                bitBuffer = "";
              }
            }
          }
        }
      }, pollRate);
    }
  </script>
</body>
</html>
