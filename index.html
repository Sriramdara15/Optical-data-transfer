<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Optical Data Transfer</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      background: #1a1a1a;
      color: #fff;
    }
    video {
      width: 100%;
      max-width: 320px;
      background: #000;
      border: 2px solid #555;
      border-radius: 8px;
    }
    .control-group {
      margin: 20px auto;
      max-width: 400px;
      background: #2a2a2a;
      padding: 15px;
      border-radius: 10px;
    }
    textarea {
      width: 90%;
      height: 60px;
      font-size: 16px;
      padding: 8px;
      border-radius: 5px;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      margin-top: 10px;
      cursor: pointer;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
    }
    button:disabled {
      background: #555;
    }
    #receivedText {
      display: inline-block;
      min-height: 24px;
      font-size: 22px;
      font-weight: bold;
      color: #4caf50;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h1>Optical Data Transfer</h1>

  <div class="control-group">
    <h2>Sender</h2>
    <textarea id="textInput" placeholder="Enter short text (e.g. Hi)"></textarea><br>
    <button id="sendBtn" onclick="startTransmission()">Transmit</button>
    <p id="sendStatus" style="font-size: 14px; color: #aaa;"></p>
  </div>

  <div class="control-group">
    <h2>Receiver</h2>
    <video id="video" autoplay playsinline muted></video><br>
    <button onclick="startReception()">Start Receiver</button>
    <p>Status: <span id="status">Idle</span></p>
    <p>Received: <span id="receivedText">---</span></p>
  </div>

  <script>
    const BIT_DURATION = 350; // ms per bit
    const PREAMBLE = "10101010";

    // --- SENDER LOGIC ---
    function textToBinary(text) {
      return text.split('').map(char =>
        char.charCodeAt(0).toString(2).padStart(8, '0')
      ).join('');
    }

    async function startTransmission() {
      const text = document.getElementById('textInput').value;
      const sendBtn = document.getElementById('sendBtn');
      const sendStatus = document.getElementById('sendStatus');
      if (!text) return;

      const lengthBinary = text.length.toString(2).padStart(8, '0');
      const payloadBinary = textToBinary(text);
      const fullSignal = PREAMBLE + lengthBinary + payloadBinary;

      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }
        });
      } catch (err) {
        alert("Sender Camera/Torch Error: " + err.message);
        return;
      }

      const track = stream.getVideoTracks()[0];
      sendBtn.disabled = true;

      for (let i = 0; i < fullSignal.length; i++) {
        const bit = fullSignal[i];
        sendStatus.innerText = `Sending bit ${i + 1}/${fullSignal.length} (${bit})`;
        try {
          await track.applyConstraints({
            advanced: [{ torch: bit === '1' }]
          });
        } catch (err) {
          console.log("Torch error:", err);
        }
        await new Promise(r => setTimeout(r, BIT_DURATION));
      }

      try {
        await track.applyConstraints({ advanced: [{ torch: false }] });
      } catch (e) {}
      track.stop();
      sendBtn.disabled = false;
      sendStatus.innerText = "Transmission complete!";
    }

    // --- RECEIVER LOGIC ---
    let mediaStream = null;
    let isReceiving = false;
    let decodeTimer = null;

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    canvas.width = 20;
    canvas.height = 20;

    function getCurrentBrightness(video) {
      if (video.readyState !== video.HAVE_ENOUGH_DATA) return 0;
      const sx = Math.max(0, (video.videoWidth / 2) - 10);
      const sy = Math.max(0, (video.videoHeight / 2) - 10);
      ctx.drawImage(video, sx, sy, 20, 20, 0, 0, 20, 20);

      const frameData = ctx.getImageData(0, 0, 20, 20).data;
      let total = 0;
      for (let i = 0; i < frameData.length; i += 4) {
        total += (frameData[i] + frameData[i + 1] + frameData[i + 2]) / 3;
      }
      return total / (frameData.length / 4);
    }

    function binaryToText(binaryStr) {
      let result = '';
      for (let i = 0; i < binaryStr.length; i += 8) {
        const byte = binaryStr.slice(i, i + 8);
        if (byte.length === 8) {
          result += String.fromCharCode(parseInt(byte, 2));
        }
      }
      return result;
    }

    async function startReception() {
      const video = document.getElementById('video');
      const statusDisplay = document.getElementById('status');
      const textDisplay = document.getElementById('receivedText');

      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }
      if (decodeTimer) clearTimeout(decodeTimer);

      statusDisplay.innerText = "Requesting camera...";

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }
        });
      } catch (err) {
        try {
          mediaStream = await navigator.mediaDevices.getUserMedia({ video: true });
        } catch (fallbackErr) {
          statusDisplay.innerText = "Camera Error: " + fallbackErr.message;
          return;
        }
      }

      video.srcObject = mediaStream;
      try { await video.play(); } catch (e) {}

      isReceiving = true;
      textDisplay.innerText = "---";

      let state = "WAITING_TRIGGER";
      let preambleSamples = [];
      let dynamicThreshold = 128;
      let bitBuffer = "";
      let expectedChars = 0;

      function poll() {
        if (!isReceiving) return;
        const brightness = getCurrentBrightness(video);

        if (state === "WAITING_TRIGGER") {
          statusDisplay.innerText = `Listening... (Current: ${Math.round(brightness)})`;
          
          // Detect brightness spike indicating start of preamble
          if (brightness > 100) { 
            state = "COLLECTING_PREAMBLE";
            statusDisplay.innerText = "Calibrating threshold...";
            preambleSamples = [];
            // Sample across the 8 preamble bits (350ms each)
            collectPreambleSample();
            return;
          }
          decodeTimer = setTimeout(poll, 100);
        }
      }

      function collectPreambleSample() {
        if (!isReceiving) return;
        const brightness = getCurrentBrightness(video);
        preambleSamples.push(brightness);

        if (preambleSamples.length < 8) {
          decodeTimer = setTimeout(collectPreambleSample, BIT_DURATION);
        } else {
          // Calculate dynamic threshold from preamble ON/OFF brightness extremes
          const maxB = Math.max(...preambleSamples);
          const minB = Math.min(...preambleSamples);
          dynamicThreshold = (maxB + minB) / 2;
          
          statusDisplay.innerText = `Calibrated! Threshold: ${Math.round(dynamicThreshold)}`;
          bitBuffer = preambleSamples.map(b => b > dynamicThreshold ? "1" : "0").join("");
          
          // Proceed to read length header and payload
          decodeTimer = setTimeout(samplePayloadBit, BIT_DURATION);
        }
      }

      function samplePayloadBit() {
        if (!isReceiving) return;
        const brightness = getCurrentBrightness(video);
        const bit = brightness > dynamicThreshold ? "1" : "0";
        bitBuffer += bit;

        // Read Length Header (bits 9 to 16)
        if (bitBuffer.length === 16) {
          const lenBits = bitBuffer.slice(8, 16);
          expectedChars = parseInt(lenBits, 2);
          if (expectedChars === 0 || expectedChars > 100) {
            statusDisplay.innerText = "Calibration error. Resetting...";
            state = "WAITING_TRIGGER";
            decodeTimer = setTimeout(poll, 500);
            return;
          }
        }

        // Read Payload Bits
        if (bitBuffer.length > 16) {
          const payloadBits = bitBuffer.slice(16);
          const totalExpectedBits = expectedChars * 8;
          statusDisplay.innerText = `Decoding (${payloadBits.length}/${totalExpectedBits})...`;
          textDisplay.innerText = binaryToText(payloadBits);

          if (payloadBits.length >= totalExpectedBits) {
            statusDisplay.innerText = "Successfully Decoded!";
            state = "WAITING_TRIGGER";
            decodeTimer = setTimeout(poll, 2000);
            return;
          }
        }

        decodeTimer = setTimeout(samplePayloadBit, BIT_DURATION);
      }

      poll();
    }
  </script>
</body>
</html>
